# Responds to @claude mentions on issues, PR comments, and reviews.
# This file has to land through a login with the GitHub `workflow` scope
# (DevOps). It only takes effect once it is on the default branch.
#
# Auth uses Duane's Claude subscription token (claude setup-token or
# /install-github-app), stored as the repo Actions secret
# CLAUDE_CODE_OAUTH_TOKEN. Alternative: replace the oauth input below
# with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}. Do not set
# both. Never commit a token or API key.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only lausellduane can start a run, and only with a write-style
    # association. Fork PRs and outside commenters are skipped. The
    # action also defaults allow_fork_prs to false.
    if: |
      github.actor == 'lausellduane' &&
      (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        ) ||
        (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          (
            (
              github.event.action == 'opened' &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
            ) ||
            github.event.action == 'assigned'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternative to the OAuth token (do not set both):
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
