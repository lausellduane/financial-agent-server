# Responds to @claude mentions on issues, PR comments, and reviews.
# This file has to land through a login with the GitHub `workflow` scope
# (DevOps). It only takes effect once it is on the default branch.
#
# Auth uses Duane's Claude subscription token (claude setup-token or
# /install-github-app), stored as the repo Actions secret
# CLAUDE_CODE_OAUTH_TOKEN. Alternative: replace the oauth input below
# with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}. Do not set
# both. Never commit a token or API key.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    # Only lausellduane can start a run, and only with a write-style
    # association. Fork PRs and outside commenters are skipped.
    # @claude is matched with a trailing boundary (space, end of text, or
    # newline) so @claudette and user@claude.com do not trigger.
    if: |
      github.actor == 'lausellduane' &&
      (
        (
          github.event_name == 'issue_comment' &&
          (
            contains(format('{0} ', github.event.comment.body), '@claude ') ||
            contains(github.event.comment.body, fromJSON('"@claude\n"')) ||
            contains(github.event.comment.body, fromJSON('"@claude\r"'))
          ) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          (
            contains(format('{0} ', github.event.comment.body), '@claude ') ||
            contains(github.event.comment.body, fromJSON('"@claude\n"')) ||
            contains(github.event.comment.body, fromJSON('"@claude\r"'))
          ) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          (
            contains(format('{0} ', github.event.review.body), '@claude ') ||
            contains(github.event.review.body, fromJSON('"@claude\n"')) ||
            contains(github.event.review.body, fromJSON('"@claude\r"'))
          ) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        ) ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == 'lausellduane' &&
          (
            contains(format('{0} ', github.event.issue.body), '@claude ') ||
            contains(github.event.issue.body, fromJSON('"@claude\n"')) ||
            contains(github.event.issue.body, fromJSON('"@claude\r"')) ||
            contains(format('{0} ', github.event.issue.title), '@claude ')
          ) &&
          (
            (
              github.event.action == 'opened' &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
            ) ||
            github.event.action == 'assigned'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternative to the OAuth token (do not set both):
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allow_fork_prs: "false"
          claude_args: |
            --max-turns 15
            --permission-mode acceptEdits
            # Only this repo's test and typecheck commands under acceptEdits.
            # Built-in file and GitHub tools still handle commits and opening a PR.
            --allowedTools "Bash(npm ci),Bash(npm test:*),Bash(npm run check:worker),Bash(npx tsc:*),Bash(npx vitest:*),Bash(npx tsx:*)"
            # Hard-block all gh and git push Bash, including merge, approve, and gh api.
            --disallowedTools "Bash(gh:*),Bash(git push:*)"
