# Responds to @claude mentions on issues, PR comments, and reviews,
# matching the official anthropics/claude-code-action example.
# Also accepts workflow_call (from openspec-auto-apply.yml) and
# workflow_dispatch (manual retry) so Apply can start without a
# mention from github-actions[bot], which the action rejects by
# default (bot actors are blocked unless listed in allowed_bots).
#
# This file has to land through a login with the GitHub `workflow`
# scope (DevOps). It only takes effect once it is on the default
# branch.
#
# Auth uses Duane's Claude subscription token (claude setup-token or
# /install-github-app), stored as the repo Actions secret
# CLAUDE_CODE_OAUTH_TOKEN. Alternative: replace the oauth input below
# with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}. Do not set
# both. Never commit a token or API key.
#
# Trigger checks match the official example plus the auto-apply
# events. The action's built-in write-access check still applies;
# there is no extra lausellduane actor gate.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  workflow_call:
    inputs:
      issue_number:
        description: Apply issue for Claude to comment on
        type: number
        required: true
      change_folder:
        description: Path of the approved folder, for example openspec/changes/my-change
        type: string
        required: true
  workflow_dispatch:
    inputs:
      issue_number:
        description: Apply issue number for Claude to comment on
        type: number
        required: true
      change_folder:
        description: Path of the approved folder, for example openspec/changes/my-change
        type: string
        required: true

jobs:
  claude:
    if: |
      (
        github.event_name == 'workflow_call' &&
        inputs.change_folder != '' &&
        inputs.issue_number != 0
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.change_folder != '' &&
        inputs.issue_number != 0
      ) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Build apply prompt
        id: apply-prompt
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CHANGE_FOLDER: ${{ inputs.change_folder }}
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid issue_number" >&2
            exit 1
          fi
          folder="${CHANGE_FOLDER%/}"
          if [[ ! "$folder" =~ ^openspec/changes/[a-z0-9-]+$ ]]; then
            echo "Invalid change_folder (expected openspec/changes/<id>, id matching [a-z0-9-]+)" >&2
            exit 1
          fi
          {
            echo "prompt<<OPENSPEC_PROMPT_EOF"
            echo "You were started automatically after the OpenSpec change folder was merged to master (Duane's green light for apply)."
            echo
            echo "Implement the approved OpenSpec change in ${folder} (issue #${ISSUE_NUMBER})."
            echo
            echo "Run /opsx:apply if that command is available; otherwise follow the change folder's tasks.md in order and tick tasks off as you go."
            echo
            echo "Prefer archiving in the same code PR: when the tasks are done, move the change folder to openspec/changes/archive/ and update openspec/specs/ so accepted specs match what is going live. If archive cannot be included in this PR, open a short follow-up PR for it after."
            echo
            echo "Post progress and the PR link as comments on issue #${ISSUE_NUMBER}."
            echo
            echo "Open a pull request against master. Do not merge, approve a pull request, push to master, force-push, or deploy. If you are stuck or a requirement is unclear, comment on the issue and stop."
            echo
            echo "Work only from the approved change folder. Do not invent extra scope."
            echo "OPENSPEC_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternative to the OAuth token (do not set both):
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty on @claude mention events so the action stays in interactive mode.
          prompt: ${{ steps.apply-prompt.outputs.prompt }}
          # Request workflows:write on the Claude GitHub App token minted
          # via OIDC. Job-level `permissions: workflows: write` is not a
          # valid GITHUB_TOKEN scope and is not set. The official Claude
          # app already lists workflows:write, but the default token
          # exchange only asks for contents, pull_requests, and issues.
          # actions:read matches the job permission already declared
          # above so Claude can read CI logs.
          additional_permissions: |
            actions: read
            workflows: write
          claude_args: |
            # Default auto mode can block Bash (including pwsh and npm).
            # Broad allows such as Bash or Bash(*) are ignored in auto
            # mode. bypassPermissions is the minimal setting that actually
            # lets Claude run any command on this ephemeral runner.
            # --allowedTools Bash covers the acceptEdits fallback the
            # action uses when auto mode does not apply.
            --permission-mode bypassPermissions
            --allowedTools Bash
            --append-system-prompt "This repository requests workflows:write on the Claude GitHub App token. You may create, edit, commit, and push files under .github/workflows/ when the user request or an approved OpenSpec change requires it. Ignore the earlier limitation that you cannot modify that directory."
